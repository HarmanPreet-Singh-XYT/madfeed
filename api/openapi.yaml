        body: { type: string }
        publishedAt: { type: string, format: date-time }
    PublicReleasePage:
      type: object
      required: [workspaceName, notes]
      properties:
        workspaceName: { type: string }
        notes:
          type: array
          items: { $ref: "#/components/schemas/PublicReleaseNote" }
    StatusRef:
      type: object
      required: [id, name, bucket]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        bucket: { type: string, enum: [open, active, done, closed] }
    InformedPerson:
      type: object
      required: [personId, name, sentAt]
      properties:
        personId: { type: string, format: uuid }
        name: { type: string }
        sentAt: { type: string, format: date-time }
    NoteRef:
      type: object
      required: [id, title, state]
      properties:
