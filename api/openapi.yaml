        id: { type: string, format: uuid }
        eventType: { type: string }
        state: { type: string, enum: [pending, sent, failed] }
        attempts: { type: integer, minimum: 0 }
        lastStatus: { type: integer }
        lastError: { type: string }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time }
    CannedReply:
      type: object
      required: [id, name, body, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 80 }
        body: { type: string, maxLength: 5000 }
        updatedAt: { type: string, format: date-time }
    CannedReplyInput:
      type: object
      additionalProperties: false
      required: [name, body]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        body: { type: string, minLength: 1, maxLength: 5000 }
    InboxSettings:
      type: object
      required: [chatEnabled, emailEnabled, origins, greeting]
      properties:
        chatEnabled: { type: boolean }
        emailEnabled: { type: boolean }
        origins: { type: array, items: { type: string } }
        greeting: { type: string }
        widgetToken: { type: string, description: "The chat widget's public address; present when chat is on" }
        inboundKey: { type: string, description: "What the mail service signs incoming messages with; present when email is on" }
    ConversationSummary:
      type: object
      required: [id, channel, state, subject, customerName, customerEmail, preview, messages, lastMessageAt, assignedToMe]
      properties:
        id: { type: string, format: uuid }
        assignedToMe: { type: boolean }
        channel: { type: string, enum: [chat, email] }
        state: { type: string, enum: [open, closed] }
        subject: { type: string }
        customerName: { type: string }
        customerEmail: { type: string }
        personId: { type: string, format: uuid }
        assignee: { type: string, format: uuid }
        preview: { type: string }
        messages: { type: integer }
        lastMessageAt: { type: string, format: date-time }
    ConversationDetail:
      allOf:
        - { $ref: "#/components/schemas/ConversationSummary" }
        - type: object
          required: [lastMessageId, thread, cards, canReply]
          properties:
            lastMessageId: { type: string, format: uuid, description: "Send this back with a reply" }
            canReply: { type: boolean }
            thread:
              type: array
              items:
                type: object
                required: [id, seq, direction, body, state, at, sentOn]
                properties:
                  id: { type: string, format: uuid }
                  seq: { type: integer }
                  direction: { type: string, enum: [in, out, note] }
                  body: { type: string }
                  authorId: { type: string, format: uuid }
                  state: { type: string }
                  error: { type: string }
                  at: { type: string, format: date-time }
                  sentOn: { type: boolean, description: "This customer message has been sent to the review queue" }
                  files:
                    type: array
                    maxItems: 3
                    items: { $ref: "#/components/schemas/ChatFile" }
            cards:
              type: array
              items:
                type: object
                required: [messageId, sourceItemId, stage, waiting, requests]
                properties:
                  messageId: { type: string, format: uuid }
                  sourceItemId: { type: string, format: uuid }
                  stage: { type: string, enum: [processing, nothing, waiting, linked] }
                  waiting: { type: integer }
                  requests:
                    type: array
                    items:
                      type: object
                      required: [id, title, status, bucket]
                      properties:
                        id: { type: string, format: uuid }
                        title: { type: string }
                        status: { type: string }
                        bucket: { type: string }
