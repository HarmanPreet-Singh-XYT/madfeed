        publishedAt: { type: string, format: date-time }
        liveNow: { type: boolean, description: "Visible on the public page right now" }
        requests:
          type: array
          items: { $ref: "#/components/schemas/LinkedRequest" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceSettings:
      type: object
      required: [name, senderName]
