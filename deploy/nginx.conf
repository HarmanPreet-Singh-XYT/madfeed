# madfeed — nginx site config for the API only. The web app is on Vercel.
# Copy to /etc/nginx/conf.d/madfeed.conf, replace the hostname, then:
#   sudo certbot --nginx -d api.example.com
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;

    # Recording uploads are chunked: each request carries one chunk (4 MiB by default).
    client_max_body_size 32m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Long AI calls answer on the request thread; do not cut them at nginx's default 60 s.
        proxy_read_timeout 120s;
        proxy_request_buffering off;
    }

    # Audio playback seeks with byte ranges; buffering would delay the first bytes.
    location ~ ^/v1/workspaces/.*/media/.*/file$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
