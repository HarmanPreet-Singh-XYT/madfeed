# Production compose for the VPS: the API and its worker. The web app is on Vercel.
# Both containers are published on 127.0.0.1 only; nginx terminates TLS in front of the API.
#
#   cp deploy/api.env.example deploy/api.env
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# See docs/DEPLOY.md for the env values, the one-off migration step and the known traps.
name: madfeed

services:
  api:
    build:
      context: ../api
    image: madfeed-api:latest
    restart: unless-stopped
    env_file: [./api.env]
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      # Recordings on local disk. Set STORAGE_S3_* in api.env instead and leave MEDIA_DIR empty
      # to keep them in a bucket; the two are mutually exclusive.
      - media:/data/media
    ports:
      - "127.0.0.1:8080:8080"

  worker:
    build:
      context: ../api
    image: madfeed-api:latest
    restart: unless-stopped
    env_file: [./api.env]
    environment:
      APP_MODE: worker
      ADDR: ":8091"
    read_only: true
    tmpfs: ["/tmp"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - media:/data/media
    stop_grace_period: 60s   # lets an in-flight extraction or send finish

volumes:
  media:
